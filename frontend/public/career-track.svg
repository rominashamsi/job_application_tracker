
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  

  <!-- Resume card -->
  <rect x="9" y="10" width="29" height="42" rx="5" fill="#FFFFFF"/>

  <!-- Profile -->
  <circle cx="18" cy="21" r="5" fill="#8DBBFF"/>
  <path d="M12 31a6 6 0 0 1 12 0" fill="#2563EB"/>

  <!-- Resume lines -->
  <rect x="26" y="18" width="8" height="3" rx="1.5" fill="#9CB8E8"/>
  <rect x="26" y="24" width="7" height="3" rx="1.5" fill="#C2D3EE"/>

  <!-- Checklist -->
  <circle cx="15" cy="38" r="2.5" fill="#F59E0B"/>
  <rect x="21" y="36.5" width="12" height="3" rx="1.5" fill="#B7C9E8"/>
  <circle cx="15" cy="45" r="2.5" fill="#60A5FA"/>
  <rect x="21" y="43.5" width="9" height="3" rx="1.5" fill="#B7C9E8"/>

  <!-- Briefcase handle -->
  <path d="M39 32v-4a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v4"
        fill="none" stroke="#174EA6" stroke-width="3.5"
        stroke-linecap="round"/>

  <!-- Briefcase -->
  <rect x="32" y="31" width="25" height="21" rx="4" fill="#2563EB"/>
  <path d="M32 37q12 7 25 0" fill="none" stroke="#174EA6" stroke-width="2"/>
  <rect x="42" y="36" width="6" height="5" rx="1.5" fill="#FFFFFF"/>

  <!-- Growth arrow -->
  <path d="M34 29 Q44 26 51 15"
        fill="none" stroke="#F59E0B" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 15 L52 12 L53 21"
